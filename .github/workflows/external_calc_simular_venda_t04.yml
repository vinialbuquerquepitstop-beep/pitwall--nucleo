name: External Calc - Simular Venda T04

on:
  pull_request:
    branches: [main]
    paths:
      - 'ferramentas/external-calc-sales-product/v0/**'
      - 'supabase/migrations/20260923061000_external_calc_sales_product_context_v0.sql'
      - 'ferramentas/external-calc-runtime/v0/runtime.js'
      - 'ferramentas/external-calc-proof-governance/v1/proof-governance.js'
      - '.github/workflows/external_calc_simular_venda_t04.yml'

permissions:
  contents: read

jobs:
  t04:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - run: node ferramentas/external-calc-sales-product/v0/prova_sales_product_service_v0.js
      - run: node ferramentas/external-calc-sales-product/v0/prova_sales_product_api_v0.js
      - run: node ferramentas/external-calc-proof-governance/v1/proof-governance.js
      - run: git diff --check
