name: External Calc C01 Review Queue API V0
on:
  pull_request:
    paths:
      - "ferramentas/external-calc-c01-review/**"
      - "ferramentas/external-calc-runtime/**"
      - "supabase/migrations/20260922184500_external_calc_c01_review_pending_queue_v0.sql"
      - ".github/workflows/external_calc_c01_review_queue_api_v0.yml"
permissions:
  contents: read
jobs:
  review-queue-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node ferramentas/external-calc-c01-review/v0/prova_c01_review_authority_core_v0.js
      - run: node ferramentas/external-calc-c01-review/v0/prova_c01_review_result_persistence_v0.js
      - run: node ferramentas/external-calc-c01-review/v0/prova_c01_review_queue_api_v0.js
      - run: node ferramentas/external-calc-c01-review/v0/prova_c01_review_pending_queue_v0.js
