name: External Calc - Proof Governance V1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ferramentas/external-calc-c01-review/v0/**'
      - 'ferramentas/external-calc-runtime/v0/**'
      - 'ferramentas/external-calc-ai-advisor/v0/**'
      - 'ferramentas/external-calc-proof-governance/v1/**'
      - 'docs/calculadora/EXTERNAL_CALC_PROOF_GOVERNANCE_V1.md'
      - 'docs/calculadora/EXTERNAL_CALC_AI_ADVISOR_A1_GATE_V0.md'
      - 'docs/calculadora/EXTERNAL_CALC_AI_ADVISOR_A2_EXECUTION_GATE_V0.md'
      - 'docs/calculadora/EXTERNAL_CALC_AI_ADVISOR_A3_RUNTIME_PERSISTENCE_GATE_V0.md'
      - 'supabase/migrations/20260925003500_external_calc_ai_advisor_a3_v0.sql'
      - 'docs/calculadora/BRAIN_CHECKPOINT_EXTERNAL_CALC_PROOF_GOVERNANCE_2026_09_22.md'
      - '.github/workflows/external_calc_*'

permissions:
  contents: read

jobs:
  proof-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Prove governance semantics
        run: |
          set -euo pipefail
          node ferramentas/external-calc-proof-governance/v1/prova_proof_governance_v1.js | tee /tmp/proof-governance.log
          grep -q '^EXTERNAL_CALC_PROOF_GOVERNANCE_V1=PASS checks=6$' /tmp/proof-governance.log
      - name: Enforce governed scope
        run: |
          set -euo pipefail
          node ferramentas/external-calc-proof-governance/v1/proof-governance.js
      - name: Negative fail-closed proof
        run: |
          set -euo pipefail
          if PROOF_GOVERNANCE_CHANGED_FILES='financeiro/producao.js' node ferramentas/external-calc-proof-governance/v1/proof-governance.js; then
            echo 'BLOQUEIO: arquivo sem ownership foi aceito'
            exit 1
          fi
          echo 'PROOF_GOVERNANCE_FAIL_CLOSED=PASS'
      - name: Diff check
        run: git diff --check
