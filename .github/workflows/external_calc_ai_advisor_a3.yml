name: External Calc - AI Advisor A3 Gate

on:
  push:
    branches:
      - external-calc-ai-advisor-a3-runtime-persistence-v0
    paths:
      - 'ferramentas/external-calc-ai-advisor/v0/**'
      - 'supabase/migrations/20260925003500_external_calc_ai_advisor_a3_v0.sql'
      - '.github/workflows/external_calc_ai_advisor_a3.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ferramentas/external-calc-ai-advisor/v0/**'
      - 'supabase/migrations/20260925003500_external_calc_ai_advisor_a3_v0.sql'
      - '.github/workflows/external_calc_ai_advisor_a3.yml'

permissions:
  contents: read

concurrency:
  group: external-calc-ai-advisor-a3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisor-a3-gate:
    name: AI Advisor A3 runtime persistence gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Preserve C01-C05
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c01/v1/prova_c01_readonly_bridge.js | tee /tmp/c01.log
          grep -q '^C01_READONLY_FIXTURES=PASS$' /tmp/c01.log

          node ferramentas/external-calc-c02/v1/prova_c02_calculator.js | tee /tmp/c02.log
          grep -q '^C02_FIXTURES=PASS checks=17$' /tmp/c02.log

          node ferramentas/external-calc-c03/v1/prova_c03_research.js | tee /tmp/c03.log
          grep -q '^C03_FIXTURES=PASS checks=21$' /tmp/c03.log

          node ferramentas/external-calc-c04/v1/prova_c04_price_indicator.js | tee /tmp/c04.log
          grep -q '^C04_FIXTURES=PASS checks=20$' /tmp/c04.log

          node ferramentas/external-calc-c05/v1/prova_c05_decision_output.js | tee /tmp/c05.log
          grep -q '^C05_FIXTURES=PASS checks=26$' /tmp/c05.log

      - name: Preserve Advisor A1 and A2
        run: |
          set -euo pipefail
          node ferramentas/external-calc-ai-advisor/v0/prova_advisor_context_v0.js | tee /tmp/a1.log
          grep -q '^AI_ADVISOR_A1_FIXTURES=PASS checks=15$' /tmp/a1.log

          node ferramentas/external-calc-ai-advisor/v0/prova_advisor_executor_v0.js | tee /tmp/a2.log
          grep -q '^AI_ADVISOR_A2_FIXTURES=PASS checks=15$' /tmp/a2.log

      - name: Run Advisor A3 fixtures
        run: |
          set -euo pipefail
          node ferramentas/external-calc-ai-advisor/v0/prova_advisor_runtime_v0.js | tee /tmp/a3.log
          grep -q '^AI_ADVISOR_A3_FIXTURES=PASS checks=15$' /tmp/a3.log

      - name: Enforce A3 boundaries
        run: |
          set -euo pipefail
          FILE=ferramentas/external-calc-ai-advisor/v0/advisor-runtime.js
          for token in \
            'service_role' \
            'tenant_id:' \
            'actor_id:' \
            'insert into' \
            'update ' \
            'delete from'; do
            if grep -Fqi "$token" "$FILE"; then
              echo "BLOQUEIO: authority/persistence direta proibida no runtime A3: $token"
              exit 1
            fi
          done
          grep -q 'extcalc_load_ai_advisor_source_v0' "$FILE"
          grep -q 'extcalc_persist_ai_advisor_execution_v0' "$FILE"
          echo "AI_ADVISOR_A3_BOUNDARY=PASS"

      - name: Diff check
        run: git diff --check
