name: External Calc - Interpreter Metamorphic Gate V1

on:
  push:
    branches:
      - audit/interpreter-generalization-v1
    paths:
      - '.github/workflows/interpreter_metamorphic_v1.yml'
      - 'ferramentas/interpreter-generalization/v1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metamorphic-real:
    name: Real corpus semantic invariance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOAD_ID: '6c4d3491-f85b-4015-8393-9798ab1ce758'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install PostgreSQL client 17
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y postgresql-client-17 >/dev/null

      - name: Extract corpus inputs read-only
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          export PATH="/usr/lib/postgresql/17/bin:$PATH"

          OWNER_ID="$(psql "$SUPABASE_DB_URL" --no-psqlrc -X -qAt -v ON_ERROR_STOP=1 -c "select u.id::text from public.app_usuario u join public.calc_carga c on c.tenant_id=u.tenant_id where c.id='$LOAD_ID'::uuid and u.ativo and u.papel='dono' order by u.id limit 1")"
          test -n "$OWNER_ID"
          CLAIMS="{\"sub\":\"$OWNER_ID\"}"

          psql "$SUPABASE_DB_URL" --no-psqlrc -X -qAt -v ON_ERROR_STOP=1 -v claims="$CLAIMS" -v load_id="$LOAD_ID" <<'SQL'
          \o /dev/null
          select set_config('request.jwt.claims', :'claims', false);
          \o /tmp/metamorphic_raw.b64
          select encode(convert_to(texto_bruto, 'UTF8'), 'base64')
            from public.calc_carga
           where id=:'load_id'::uuid and texto_bruto is not null;
          \o /tmp/metamorphic_suppliers.json
          select jsonb_build_object(
            'contract_version','supplier-profiles/v1',
            'profiles',coalesce((
              select jsonb_agg(jsonb_build_object(
                'id',f.codigo,
                'label',f.nome,
                'aliases',coalesce((
                  select jsonb_agg(a.texto order by length(a.texto) desc,a.texto)
                    from public.calc_alias a
                   where a.tenant_id=f.tenant_id
                     and a.tipo='fornecedor'
                     and a.aponta=f.codigo
                ),'[]'::jsonb)
              ) order by length(f.nome) desc,f.nome)
                from public.calc_fornecedor f
               where f.tenant_id=c.tenant_id and f.ativo
            ),'[]'::jsonb)
          )::text
            from public.calc_carga c
           where c.id=:'load_id'::uuid;
          \o
          SQL

          test -s /tmp/metamorphic_raw.b64
          test -s /tmp/metamorphic_suppliers.json
          base64 --decode /tmp/metamorphic_raw.b64 > /tmp/metamorphic_raw.txt
          node -e "JSON.parse(require('fs').readFileSync('/tmp/metamorphic_suppliers.json','utf8'));"

      - name: Run semantic invariance proof
        run: |
          set -euo pipefail
          node ferramentas/interpreter-generalization/v1/prova_metamorphic_real.js /tmp/metamorphic_raw.txt /tmp/metamorphic_suppliers.json | tee /tmp/metamorphic.log
          grep -q '^METAMORPHIC_REAL_GATE=PASS$' /tmp/metamorphic.log

      - name: Cleanup private files
        if: always()
        run: rm -f /tmp/metamorphic_*
