name: fila-fatia6-temp
on:
  push:
    branches: [codex/fila-operacional-v2-fatia6]
permissions:
  contents: write
jobs:
  validar:
    if: ${{ !contains(github.event.head_commit.message, '[fat6-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fila-operacional-v2-fatia6
          fetch-depth: 0
      - name: Prepare deps
        run: python -m pip install esprima
      - name: Apply patch
        run: python ferramentas/patch_fila_operacional_v2_fatia6.py
      - name: Validate
        shell: pwsh
        run: |
          git diff --check
          python ferramentas/validar.py
          node ferramentas/prova_fila_operacional_v2.js
          node ferramentas/prova_fila_operacional_v2_fatia3.js
          node ferramentas/prova_fila_operacional_v2_fatia4.js
          node ferramentas/prova_fila_operacional_v2_fatia5.js
          node ferramentas/prova_fila_operacional_v2_fatia6.js
          node ferramentas/prova_hoje_fila_harmonia.js
          python ferramentas/diag_mobile.py 390
          python ferramentas/diag_mobile.py 1280
      - name: Build visual harness
        shell: pwsh
        continue-on-error: true
        run: python ferramentas/harness.py
      - name: Screenshot Hoje
        shell: pwsh
        run: python ferramentas/foto.py hoje 1280 1600
      - uses: actions/upload-artifact@v4
        with:
          name: fila-fatia6-visual
          path: docs/design/foto_hoje_1280.png
      - name: Commit product
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.js public/app.css ferramentas/prova_fila_operacional_v2_fatia6.js
          git commit -m "feat(crm): adiciona indicadores de execucao da Fatia 6 [fat6-applied]"
          git push origin HEAD:codex/fila-operacional-v2-fatia6
