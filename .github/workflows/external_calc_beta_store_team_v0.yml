name: External Calc - Beta Store Team Access V0

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260922213000_external_calc_beta_store_team_access_v0.sql'
      - 'ferramentas/external-calc-access/v0/**'
      - 'ferramentas/external-calc-runtime/v0/runtime.js'
      - 'ferramentas/external-calc-runtime/v0/prova_runtime_v0.js'
      - 'ferramentas/external-calc-runtime/v0/prova_c01_review_runtime_api_v0.js'
      - 'docs/calculadora/EXTERNAL_CALC_BETA_STORE_TEAM_ACCESS_V0.md'
      - '.github/workflows/external_calc_beta_store_team_v0.yml'

permissions:
  contents: read

jobs:
  beta-store-team:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Prove beta access migration contract
        run: |
          set -euo pipefail
          node ferramentas/external-calc-access/v0/prova_beta_store_team_access_v0.js | tee /tmp/beta-access.log
          grep -q '^EXTERNAL_CALC_BETA_STORE_TEAM_ACCESS_V0=PASS$' /tmp/beta-access.log

      - name: Prove runtime role policy
        run: |
          set -euo pipefail
          node ferramentas/external-calc-runtime/v0/prova_runtime_v0.js | tee /tmp/runtime.log
          grep -q '^EXTERNAL_CALC_RUNTIME_V0=PASS checks=12$' /tmp/runtime.log

      - name: Prove review role policy
        run: |
          set -euo pipefail
          node ferramentas/external-calc-runtime/v0/prova_c01_review_runtime_api_v0.js | tee /tmp/review.log
          grep -q '^C01_REVIEW_RUNTIME_API_GATE_V0=PASS checks=9$' /tmp/review.log

      - name: Enforce beta role boundary
        run: |
          set -euo pipefail
          FILE=supabase/migrations/20260922213000_external_calc_beta_store_team_access_v0.sql
          grep -Fq "'validador'::text" "$FILE"
          grep -Fq "in ('dono', 'validador')" "$FILE"
          grep -Fq "papel', 'validador'" "$FILE"
          grep -Fq "EXTCALC_BETA_INVITE_EMAIL_MISMATCH" "$FILE"
          grep -Fq "EXTCALC_MEMBERSHIP_CONFLICT" "$FILE"

          if grep -Fq "in ('dono', 'vendedor')" "$FILE"; then
            echo "BLOQUEIO: vendedor recebeu acesso beta privilegiado"
            exit 1
          fi

          if grep -Fqi "service_role" "$FILE" ferramentas/external-calc-runtime/v0/runtime.js; then
            echo "BLOQUEIO: service role entrou no beta access"
            exit 1
          fi

          echo "EXTERNAL_CALC_BETA_ROLE_BOUNDARY=PASS"

      - name: Diff check
        run: git diff --check

      - name: Enforce governed scope
        run: node ferramentas/external-calc-proof-governance/v1/proof-governance.js
