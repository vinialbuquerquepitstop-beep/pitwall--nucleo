name: E2 patch controlado

on:
  push:
    branches: [financeiro-e2]
    paths:
      - .github/workflows/e2_patch_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: financeiro-e2
          fetch-depth: 0

      - name: Aplicar patch fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # ---------- frontend ----------
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8')

          old = '''function finNotaDif(x){
          var v=Number(x)||0;
          return(v<0?"−":"+")+brlV(Math.abs(v))}'''
          new = '''function finNotaV(n,x){
          var v=Number(x)||0;
          return n&&"pct"===n.unidade?v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%":brlV(v)}
          function finNotaDif(n,x){
          var v=Number(x)||0;
          return(v<0?"−":"+")+finNotaV(n,Math.abs(v))}'''
          if s.count(old) != 1:
              raise SystemExit(f'app.js: esperava 1 finNotaDif antigo, encontrei {s.count(old)}')
          s = s.replace(old, new, 1)

          old = 'pt.push("de <b>"+brlV(n.valor_antes)+"</b> para <b>"+brlV(n.valor_depois)+"</b>");'
          new = 'pt.push("de <b>"+finNotaV(n,n.valor_antes)+"</b> para <b>"+finNotaV(n,n.valor_depois)+"</b>");'
          if s.count(old) != 1:
              raise SystemExit(f'app.js: linha valor nota divergente: {s.count(old)}')
          s = s.replace(old, new, 1)

          old = 'pt.push("<b>"+finNotaDif(n.diferenca)+"</b>");'
          new = 'pt.push("<b>"+finNotaDif(n,n.diferenca)+"</b>");'
          if s.count(old) != 1:
              raise SystemExit(f'app.js: linha diferenca nota divergente: {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # ---------- contrato ----------
          p = Path('docs/financeiro/CONTRATO.md')
          s = p.read_text(encoding='utf-8')
          anchor = 'Dominio invalido: use empresa ou pessoal.\n'
          add = (
              'Dominio invalido: use empresa, pessoal ou tudo.\n'
              'Dominio exige contraparte especifica: use nome ou identificador da contraparte, nao um tipo de transacao.\n'
          )
          if 'Dominio exige contraparte especifica:' not in s:
              if s.count(anchor) != 1:
                  raise SystemExit(f'CONTRATO: ancora de dominio divergente: {s.count(anchor)}')
              s = s.replace(anchor, anchor + add, 1)
          p.write_text(s, encoding='utf-8')

          # ---------- fin_painel passa unidade da nota ----------
          src = Path('supabase/migrations/20260904_fin_painel_notas.sql').read_text(encoding='utf-8')
          marker = 'create or replace function public.fin_painel'
          if src.count(marker) != 1:
              raise SystemExit('migration E1: fin_painel nao localizado de forma unica')
          fn = src[src.index(marker):]
          old = "           'mudou_em',     n.mudou_em)"
          new = "           'mudou_em',     n.mudou_em,\n           'unidade',       n.unidade)"
          if fn.count(old) != 1:
              raise SystemExit(f'fin_painel: ponto de unidade divergente: {fn.count(old)}')
          fn = fn.replace(old, new, 1)
          out = '''-- E2: fin_painel devolve a unidade da nota de numero.\n-- O calculo do painel permanece identico ao E1; apenas o JSON de `notas` ganha `unidade`,\n-- para a tela nao formatar pct_julgado como BRL.\n\n''' + fn
          Path('supabase/migrations/20260915_fin_e2_painel_unidade.sql').write_text(out, encoding='utf-8')

          # ---------- prova estatica dedicada da E2 ----------
          proof = r'''from pathlib import Path

app = Path("public/app.js").read_text(encoding="utf-8")
contract = Path("docs/financeiro/CONTRATO.md").read_text(encoding="utf-8")
e2 = Path("supabase/migrations/20260915_fin_e2_sem_dominio_silencioso.sql").read_text(encoding="utf-8")
painel = Path("supabase/migrations/20260915_fin_e2_painel_unidade.sql").read_text(encoding="utf-8")

checks = {
    "fin6: nota pct tem formatador proprio": '"pct"===n.unidade' in app and 'finNotaV(n,n.valor_antes)' in app,
    "fin6: diferenca pct usa a mesma unidade": 'finNotaDif(n,n.diferenca)' in app,
    "fin6: painel devolve unidade": "'unidade',       n.unidade" in painel,
    "fin6: regra generica nao pode escrever dominio": 'v_contrapartes > 3' in e2 and 'Dominio exige contraparte especifica:' in e2,
    "fin6: forcar nao envolve a defesa de dominio": 'if v_dom is not null and v_cat is null' in e2,
    "fin6: Compra no debito preserva prioridade 9000": "prioridade = 9000" in e2 and "ativo = false" in e2,
    "fin6: conjunto medido falha fechado": 'v_n <> 214 or v_val <> 8207.31' in e2,
    "fin6: nota declara 214 e 8207,31": '214 lançamentos, somando R$ 8.207,31' in e2,
    "fin6: contrato conhece recusa E2": 'Dominio exige contraparte especifica:' in contract,
    "fin6: contrato conhece dominio tudo": 'Dominio invalido: use empresa, pessoal ou tudo.' in contract,
}

bad = []
for name, ok in checks.items():
    print(f"{name}: {'OK' if ok else 'FALHA'}")
    if not ok: bad.append(name)
if bad:
    raise SystemExit("E2 reprovada: " + ", ".join(bad))
print(f"fin6: {len(checks)}/{len(checks)}")
'''
          Path('ferramentas/prova_financeiro_e2.py').write_text(proof, encoding='utf-8')
          PY

      - name: Portoes de codigo
        shell: bash
        run: |
          set -euo pipefail
          python ferramentas/prova_financeiro_e2.py
          node --check public/app.js
          python ferramentas/validar.py
          python ferramentas/harness.py
          python ferramentas/prova_trilho.py
          python ferramentas/prova_grafico.py
          python ferramentas/prova_atmosfera.py

      - name: Commitar somente a E2 e remover este workflow temporario
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitwall-e2-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/e2_patch_once.yml
          git add public/app.js docs/financeiro/CONTRATO.md \
            supabase/migrations/20260915_fin_e2_painel_unidade.sql \
            ferramentas/prova_financeiro_e2.py
          git diff --cached --check
          git commit -m "feat(financeiro): fecha interface e contrato da E2"
          git push origin HEAD:financeiro-e2
