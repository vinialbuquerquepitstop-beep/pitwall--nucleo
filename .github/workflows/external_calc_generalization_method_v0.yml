name: External Calc - Generalization Method V0
on:
  pull_request:
    paths:
      - 'docs/external-calc/EXTERNAL_CALC_EXECUCAO_LINEAR_V3_GENERALIZACAO.md'
      - 'docs/external-calc/EXTERNAL_CALC_VERTICAL_SLICES_GENERALIZATION_V1.md'
      - 'docs/external-calc/EXTERNAL_CALC_GENERALIZATION_DECISION_ADR_2026-10-20.md'
      - 'docs/external-calc/EXTERNAL_CALC_VS53D_TRUSTED_SOURCE_CONTRACT_V0.md'
      - 'docs/external-calc/EXTERNAL_CALC_VS53E_STAGING_ORIGINAL_SOURCE_PROPOSAL_V0.md'
      - 'docs/external-calc/EXTERNAL_CALC_VS53F_ORIGINAL_BYTES_PROOF_V0.md'
      - 'docs/external-calc/EXTERNAL_CALC_VS53G_STAGING_RLS_READONLY_MATRIX_V0.md'
      - 'docs/external-calc/EXTERNAL_CALC_VS53H_STAGING_GET_GUARD_V0.md'
      - 'ferramentas/external-calc-generalization/v0/**'
      - '.github/workflows/external_calc_generalization_method_v0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          set -e
          for s in generate verify compare run-parser proof prova_ownership proof-vs1 proof-vs2 proof-vs3 proof-vs4 proof-vs4-calibration evaluate-vs4 run-segmentation-shadow run-association-shadow run-review-shadow; do node --check ferramentas/external-calc-generalization/v0/$s.mjs; done
      - name: Check generalization ownership with strict unknown-file denial
        run: node ferramentas/external-calc-generalization/v0/prova_ownership.mjs
      - name: Prove generator, independent oracle and comparator
        run: node ferramentas/external-calc-generalization/v0/proof.mjs
      - name: Prove VS1 structural shadow boundaries (known DEV only)
        run: node ferramentas/external-calc-generalization/v0/proof-vs1.mjs
      - name: VS2 association source spans, abstentions and synthetic DEV oracles
        run: |
          node --check ferramentas/external-calc-generalization/v0/associate-shadow.cjs
          node ferramentas/external-calc-generalization/v0/proof-vs2.mjs
      - name: VS3 review evidence and uncertainty safety
        run: |
          node --check ferramentas/external-calc-generalization/v0/review-shadow.cjs
          node ferramentas/external-calc-generalization/v0/proof-vs3.mjs
      - name: VS4 independent evaluator with mutation and false-authority controls
        run: node ferramentas/external-calc-generalization/v0/proof-vs4.mjs
      - name: VS4 adversarial calibration (unsafe abstention versus valid coverage)
        run: node ferramentas/external-calc-generalization/v0/proof-vs4-calibration.mjs
      - name: VS5 read-only C01 field compatibility and no-authority tests
        run: |
          node --check ferramentas/external-calc-generalization/v0/c01-compatibility-shadow.cjs
          node --check ferramentas/external-calc-generalization/v0/proof-vs5.mjs
          node ferramentas/external-calc-generalization/v0/proof-vs5.mjs
      - name: VS5.1 oracle comparison of C01 legacy and shadow in read-only mode
        run: |
          node --check ferramentas/external-calc-generalization/v0/triangular-proof.cjs
          node --check ferramentas/external-calc-generalization/v0/proof-vs51.mjs
          node ferramentas/external-calc-generalization/v0/proof-vs51.mjs
      - name: VS5.2 trusted Service preview boundary and authority guard
        run: |
          node --check ferramentas/external-calc-generalization/v0/service-preview-contract.cjs
          node --check ferramentas/external-calc-generalization/v0/proof-vs52.mjs
          node ferramentas/external-calc-generalization/v0/proof-vs52.mjs
      - name: VS5.3 isolated auth-bound preview route and negative checks
        run: |
          node --check ferramentas/external-calc-generalization/v0/preview-api-shadow.cjs
          node --check ferramentas/external-calc-generalization/v0/proof-vs53.mjs
          node ferramentas/external-calc-generalization/v0/proof-vs53.mjs
      - name: VS5.3b reuse runtime identity verifier with HTTP auth fixture and zero writes
        run: |
          node --check ferramentas/external-calc-generalization/v0/identity-bridge-shadow.cjs
          node --check ferramentas/external-calc-generalization/v0/proof-vs53b.mjs
          node ferramentas/external-calc-generalization/v0/proof-vs53b.mjs
      - name: VS5.3c static RLS and staging readiness preflight
        run: node ferramentas/external-calc-generalization/v0/preflight-vs53c.mjs
      - name: VS5.3d immutable original source resolver and preview checks
        run: |
          node --check ferramentas/external-calc-generalization/v0/trusted-original-source.cjs
          node ferramentas/external-calc-generalization/v0/proof-vs53d.mjs
      - name: VS5.3f original bytes exact roundtrip and fail-closed checks
        run: |
          node --check ferramentas/external-calc-generalization/v0/trusted-original-byte-adapter.cjs
          node --check ferramentas/external-calc-generalization/v0/proof-vs53f.mjs
          node ferramentas/external-calc-generalization/v0/proof-vs53f.mjs
      - name: VS5.3g read-only RLS isolation matrix (synthetic, NOT real RLS)
        run: |
          node --check ferramentas/external-calc-generalization/v0/staging-rls-readonly-matrix.cjs
          node --check ferramentas/external-calc-generalization/v0/proof-vs53g.mjs
          node ferramentas/external-calc-generalization/v0/proof-vs53g.mjs
      - name: VS5.3h guarded staging GET transport (mock HTTP only, NO live Supabase)
        run: |
          node --check ferramentas/external-calc-generalization/v0/guarded-staging-read-transport.cjs
          node --check ferramentas/external-calc-generalization/v0/proof-vs53h.mjs
          node ferramentas/external-calc-generalization/v0/proof-vs53h.mjs
      - name: Run a development synthetic sample against real C01 (informational, NO-GO unless exact)
        run: |
          set -eu
          DIR="$(mktemp -d)"
          trap 'rm -rf "$DIR"' EXIT
          node ferramentas/external-calc-generalization/v0/generate.mjs --seed dev-demo-north-0001 --profile dev --count 20 --output "$DIR"
          node ferramentas/external-calc-generalization/v0/verify.mjs "$DIR"
          node ferramentas/external-calc-generalization/v0/run-segmentation-shadow.mjs --source "$DIR/supplier.txt" --report "$DIR/structural.json"
          node ferramentas/external-calc-generalization/v0/run-association-shadow.mjs --source "$DIR/supplier.txt" --report "$DIR/associations.json"
          node ferramentas/external-calc-generalization/v0/run-review-shadow.mjs --source "$DIR/supplier.txt" --report "$DIR/review.json"
          node ferramentas/external-calc-generalization/v0/run-parser.mjs --source "$DIR/supplier.txt" --actual "$DIR/actual.json"
          if node ferramentas/external-calc-generalization/v0/compare.mjs --oracle "$DIR/oracle.json" --actual "$DIR/actual.json" --report "$DIR/report.json"; then
            echo "DEV_SAMPLE_EXACT_PASS (NOT external-unseen proof)"
          else
            echo "DEV_SAMPLE_FIDELITY_FAIL => Gate generalization remains NO-GO"
          fi
          cat "$DIR/report.json" | head -n 20
