name: External Calc - Generalization Method V0
on:
  pull_request:
    paths:
      - 'docs/external-calc/EXTERNAL_CALC_EXECUCAO_LINEAR_V3_GENERALIZACAO.md'
      - 'docs/external-calc/EXTERNAL_CALC_VERTICAL_SLICES_GENERALIZATION_V1.md'
      - 'docs/external-calc/EXTERNAL_CALC_GENERALIZATION_DECISION_ADR_2026-10-20.md'
      - 'ferramentas/external-calc-generalization/v0/**'
      - '.github/workflows/external_calc_generalization_method_v0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          set -e
          for s in generate verify compare run-parser proof prova_ownership proof-vs1 run-segmentation-shadow; do node --check ferramentas/external-calc-generalization/v0/$s.mjs; done
      - name: Check generalization ownership with strict unknown-file denial
        run: node ferramentas/external-calc-generalization/v0/prova_ownership.mjs
      - name: Prove generator, independent oracle and comparator
        run: node ferramentas/external-calc-generalization/v0/proof.mjs
      - name: Prove VS1 structural shadow boundaries (known DEV only)
        run: node ferramentas/external-calc-generalization/v0/proof-vs1.mjs
      - name: Run a development synthetic sample against real C01 (informational, NO-GO unless exact)
        run: |
          set -eu
          DIR="$(mktemp -d)"
          trap 'rm -rf "$DIR"' EXIT
          node ferramentas/external-calc-generalization/v0/generate.mjs --seed dev-demo-north-0001 --profile dev --count 20 --output "$DIR"
          node ferramentas/external-calc-generalization/v0/verify.mjs "$DIR"
          node ferramentas/external-calc-generalization/v0/run-segmentation-shadow.mjs --source "$DIR/supplier.txt" --report "$DIR/structural.json"
          node ferramentas/external-calc-generalization/v0/run-parser.mjs --source "$DIR/supplier.txt" --actual "$DIR/actual.json"
          if node ferramentas/external-calc-generalization/v0/compare.mjs --oracle "$DIR/oracle.json" --actual "$DIR/actual.json" --report "$DIR/report.json"; then
            echo "DEV_SAMPLE_EXACT_PASS (NOT external-unseen proof)"
          else
            echo "DEV_SAMPLE_FIDELITY_FAIL => Gate generalization remains NO-GO"
          fi
          cat "$DIR/report.json" | head -n 20
