name: External Calc - C04 Price Indicator Gate

on:
  push:
    branches:
      - feat/external-calc-c04-v1
      - fix/external-calc-selective-staleness-v1
    paths:
      - 'ferramentas/external-calc-c04/v1/**'
      - '.github/workflows/external_calc_c04.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ferramentas/external-calc-c04/v1/**'
      - '.github/workflows/external_calc_c04.yml'

permissions:
  contents: read

concurrency:
  group: external-calc-c04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c04-gate:
    name: C04 price signal gate
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Preserve C01 and C03
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c01/v1/prova_c01_readonly_bridge.js | tee /tmp/c01.log
          grep -q '^C01_READONLY_FIXTURES=PASS$' /tmp/c01.log
          node ferramentas/external-calc-c03/v1/prova_c03_research.js | tee /tmp/c03.log
          grep -q '^C03_FIXTURES=PASS checks=21$' /tmp/c03.log

      - name: Run C04 price indicator fixtures
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c04/v1/prova_c04_price_indicator.js | tee /tmp/c04.log
          grep -q '^C04_FIXTURES=PASS checks=20$' /tmp/c04.log

      - name: Enforce C04 trust boundary
        run: |
          set -euo pipefail
          FILE=ferramentas/external-calc-c04/v1/c04-price-indicator.js
          for token in             'supabase'             'postgres'             'tenant_id'             'fetch('             'XMLHttpRequest'             'child_process'             'writeFile'             'unlink('             'document.'             'window.'             'localStorage'             'external-calc-c02'; do
            if grep -Fqi "$token" "$FILE"; then
              echo "BLOQUEIO: dependencia proibida no C04: $token"
              exit 1
            fi
          done
          echo "C04_BOUNDARY=PASS"
