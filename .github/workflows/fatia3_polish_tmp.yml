name: fatia3-polish-temp
on:
  push:
    branches: [codex/fatia3-polish-acoes]
permissions:
  contents: write
jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[polish-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fatia3-polish-acoes
          fetch-depth: 0
      - name: Apply visual polish
        run: python ferramentas/patch_fatia3_polish_acoes.py
      - name: Validate scope
        run: |
          git diff --check
          git diff -- public/app.css
          test -z "$(git diff --name-only | grep -v '^public/app.css$')"
      - name: Commit polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.css
          git commit -m "style(crm): harmoniza acoes da Fatia 3 [polish-applied]"
          git push origin HEAD:codex/fatia3-polish-acoes
