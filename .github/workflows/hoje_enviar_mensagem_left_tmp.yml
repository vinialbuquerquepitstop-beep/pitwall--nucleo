name: hoje-enviar-mensagem-left-temp
on:
  push:
    branches: [codex/hoje-enviar-mensagem-left]
permissions:
  contents: write
jobs:
  validar:
    if: ${{ !contains(github.event.head_commit.message, '[hoje-enviar-left-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hoje-enviar-mensagem-left
          fetch-depth: 0
      - name: Prepare deps
        run: python -m pip install esprima
      - name: Apply ajuste
        run: python ferramentas/patch_hoje_enviar_mensagem_left.py
      - name: Validate
        shell: pwsh
        run: |
          git diff --check
          python ferramentas/validar.py
          node ferramentas/prova_fila_operacional_v2.js
          node ferramentas/prova_fila_operacional_v2_fatia3.js
          node ferramentas/prova_fila_operacional_v2_fatia4.js
          node ferramentas/prova_fila_operacional_v2_fatia5.js
          node ferramentas/prova_hoje_fila_harmonia.js
          python ferramentas/diag_mobile.py 390
          python ferramentas/diag_mobile.py 1280
      - name: Commit
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.js public/app.css ferramentas/prova_hoje_fila_harmonia.js ferramentas/harness.py
          git commit -m "style(frontend): ajusta CTA da fila Hoje [hoje-enviar-left-applied]"
          git push origin HEAD:codex/hoje-enviar-mensagem-left
