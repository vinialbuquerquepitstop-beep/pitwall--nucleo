name: fatia4-temp
on:
  push:
    branches: [codex/fila-operacional-v2-fatia4]
permissions:
  contents: write
jobs:
  fatia4:
    if: ${{ !contains(github.event.head_commit.message, '[fat4-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fila-operacional-v2-fatia4
          fetch-depth: 0
      - name: Prepare deps
        run: python -m pip install esprima
      - name: Apply Fatia 4
        run: python ferramentas/patch_fila_operacional_v2_fatia4.py
      - name: Validate
        run: |
          git diff --check
          python ferramentas/validar.py
          node ferramentas/prova_fila_operacional_v2.js
          node ferramentas/prova_fila_operacional_v2_fatia3.js
          node ferramentas/prova_fila_operacional_v2_fatia4.js
      - name: Validate scope
        run: |
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "public/app.css "
      - name: Commit product
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.css
          git commit -m "feat(crm): aplica desfecho rapido da Fatia 4 [fat4-applied]"
          git push origin HEAD:codex/fila-operacional-v2-fatia4
