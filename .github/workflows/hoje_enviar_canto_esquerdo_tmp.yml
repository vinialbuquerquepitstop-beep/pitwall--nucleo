name: hoje-enviar-canto-esquerdo-temp
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validar:
    if: ${{ !contains(github.event.head_commit.message, '[hoje-canto-esquerdo-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare deps
        run: python -m pip install esprima
      - name: Apply ajuste
        run: python ferramentas/patch_hoje_enviar_canto_esquerdo.py
      - name: Validate
        shell: pwsh
        run: |
          git diff --check
          python ferramentas/validar.py
          node ferramentas/prova_hoje_fila_harmonia.js
          python ferramentas/diag_mobile.py 390
          python ferramentas/diag_mobile.py 1280
      - name: Commit
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.js public/app.css ferramentas/prova_hoje_fila_harmonia.js
          git commit -m "style(frontend): move Enviar mensagem para canto esquerdo [hoje-canto-esquerdo-applied]"
          git push origin HEAD:main
