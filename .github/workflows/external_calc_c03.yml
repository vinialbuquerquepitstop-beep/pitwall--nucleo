name: External Calc - C03 Research Gate

on:
  push:
    branches:
      - feat/external-calc-c03-v1
      - fix/external-calc-selective-staleness-v1
    paths:
      - 'ferramentas/external-calc-c03/v1/**'
      - '.github/workflows/external_calc_c03.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ferramentas/external-calc-c03/v1/**'
      - '.github/workflows/external_calc_c03.yml'

permissions:
  contents: read

concurrency:
  group: external-calc-c03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c03-gate:
    name: C03 pure research semantics gate
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Preserve C01 contract
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c01/v1/prova_c01_readonly_bridge.js | tee /tmp/c01.log
          grep -q '^C01_READONLY_FIXTURES=PASS$' /tmp/c01.log

      - name: Run C03 research fixtures
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c03/v1/prova_c03_research.js | tee /tmp/c03.log
          grep -q '^C03_FIXTURES=PASS checks=21$' /tmp/c03.log

      - name: Enforce C03 trust boundary
        run: |
          set -euo pipefail
          FILE=ferramentas/external-calc-c03/v1/c03-research-core.js
          for token in             'supabase'             'postgres'             'tenant_id'             'fetch('             'XMLHttpRequest'             'child_process'             'writeFile'             'unlink('             'document.'             'window.'             'localStorage'             'external-calc-c02'; do
            if grep -Fqi "$token" "$FILE"; then
              echo "BLOQUEIO: dependencia proibida no C03 Core: $token"
              exit 1
            fi
          done
          echo "C03_BOUNDARY=PASS"
