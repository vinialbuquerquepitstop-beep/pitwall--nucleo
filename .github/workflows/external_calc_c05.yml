name: External Calc - C05 Decision Output Gate

on:
  push:
    branches:
      - feat/external-calc-c05-v1
    paths:
      - 'ferramentas/external-calc-c05/v1/**'
      - '.github/workflows/external_calc_c05.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ferramentas/external-calc-c05/v1/**'
      - '.github/workflows/external_calc_c05.yml'

permissions:
  contents: read

concurrency:
  group: external-calc-c05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c05-gate:
    name: C05 decision composition gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Preserve upstream contracts
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c01/v1/prova_c01_readonly_bridge.js | tee /tmp/c01.log
          grep -q '^C01_READONLY_FIXTURES=PASS$' /tmp/c01.log

          node ferramentas/external-calc-c02/v1/prova_c02_calculator.js | tee /tmp/c02.log
          grep -q '^C02_FIXTURES=PASS checks=17$' /tmp/c02.log

          node ferramentas/external-calc-c03/v1/prova_c03_research.js | tee /tmp/c03.log
          grep -q '^C03_FIXTURES=PASS checks=19$' /tmp/c03.log

          node ferramentas/external-calc-c04/v1/prova_c04_price_indicator.js | tee /tmp/c04.log
          grep -q '^C04_FIXTURES=PASS checks=19$' /tmp/c04.log

      - name: Run C05 decision fixtures
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c05/v1/prova_c05_decision_output.js | tee /tmp/c05.log
          grep -q '^C05_FIXTURES=PASS checks=26$' /tmp/c05.log

      - name: Enforce C05 composition boundary
        run: |
          set -euo pipefail
          FILE=ferramentas/external-calc-c05/v1/c05-decision-output.js
          for token in             'supabase'             'postgres'             'tenant_id'             'fetch('             'XMLHttpRequest'             'child_process'             'writeFile'             'unlink('             'document.'             'window.'             'localStorage'             "require('../../external-calc"; do
            if grep -Fqi "$token" "$FILE"; then
              echo "BLOQUEIO: dependencia proibida no C05: $token"
              exit 1
            fi
          done
          echo "C05_BOUNDARY=PASS"
