name: hoje-acoes-mesma-linha-temp
on:
  push:
    branches: [codex/hoje-acoes-mesma-linha]
permissions:
  contents: write
jobs:
  validar:
    if: ${{ !contains(github.event.head_commit.message, '[hoje-acoes-linha-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hoje-acoes-mesma-linha
          fetch-depth: 0
      - name: Prepare deps
        run: python -m pip install esprima
      - name: Apply ajuste
        run: python ferramentas/patch_hoje_acoes_mesma_linha.py
      - name: Validate targeted
        shell: pwsh
        run: |
          git diff --check
          python ferramentas/validar.py
          node ferramentas/prova_hoje_fila_harmonia.js
          python ferramentas/diag_mobile.py 390
          python ferramentas/diag_mobile.py 1280
      - name: Build visual harness
        shell: pwsh
        continue-on-error: true
        run: python ferramentas/harness.py
      - name: Screenshot Hoje
        shell: pwsh
        run: python ferramentas/foto.py hoje 1280 1600
      - uses: actions/upload-artifact@v4
        with:
          name: hoje-acoes-mesma-linha
          path: docs/design/foto_hoje_1280.png
      - name: Commit
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.js public/app.css ferramentas/prova_hoje_fila_harmonia.js
          git commit -m "fix(frontend): alinha acoes da Hoje na mesma faixa [hoje-acoes-linha-applied]"
          git push origin HEAD:codex/hoje-acoes-mesma-linha
