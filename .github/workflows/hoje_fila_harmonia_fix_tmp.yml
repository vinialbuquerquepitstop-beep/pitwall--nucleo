name: hoje-fila-harmonia-fix-temp
on:
  push:
    branches: [codex/hoje-fila-harmonia]
permissions:
  contents: write
jobs:
  validar:
    if: ${{ !contains(github.event.head_commit.message, '[hoje-harmonia-fix-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hoje-fila-harmonia
          fetch-depth: 0
      - name: Prepare deps
        run: python -m pip install esprima
      - name: Apply validation fixes
        run: python ferramentas/patch_hoje_fila_harmonia_fix.py
      - name: Diff check
        run: git diff --check
      - name: Validate structure
        run: python ferramentas/validar.py
      - name: Prove queue baseline
        run: node ferramentas/prova_fila_operacional_v2.js
      - name: Prove Fatia 3
        run: node ferramentas/prova_fila_operacional_v2_fatia3.js
      - name: Prove Fatia 4 contextual hierarchy
        run: node ferramentas/prova_fila_operacional_v2_fatia4.js
      - name: Prove Fatia 5
        run: node ferramentas/prova_fila_operacional_v2_fatia5.js
      - name: Prove Hoje harmony
        run: node ferramentas/prova_hoje_fila_harmonia.js
      - name: Mobile 390
        run: python ferramentas/diag_mobile.py 390
      - name: Desktop 1280
        run: python ferramentas/diag_mobile.py 1280
      - name: Build harness for photo
        run: python ferramentas/harness.py
        continue-on-error: true
      - name: Foto Hoje
        run: python ferramentas/foto.py hoje 1280 1600
      - uses: actions/upload-artifact@v4
        with:
          name: hoje-fila-harmonia-fix-1280
          path: docs/design/foto_hoje_1280.png
      - name: Clean photo
        shell: pwsh
        run: |
          if (git ls-files --error-unmatch docs/design/foto_hoje_1280.png 2>$null) { git restore docs/design/foto_hoje_1280.png } else { Remove-Item docs/design/foto_hoje_1280.png -ErrorAction SilentlyContinue }
      - name: Validate product scope
        shell: pwsh
        run: |
          $names = (git diff --name-only | Sort-Object) -join ' '
          Write-Output $names
          if ($names -ne 'public/app.css public/app.js') { throw "Escopo inesperado: $names" }
      - name: Commit product fix
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.js public/app.css
          git commit -m "fix(frontend): fecha validacao da fila Hoje [hoje-harmonia-fix-applied]"
          git push origin HEAD:codex/hoje-fila-harmonia
