name: hoje-fila-harmonia-temp
on:
  push:
    branches: [codex/hoje-fila-harmonia]
permissions:
  contents: write
jobs:
  validar:
    if: ${{ !contains(github.event.head_commit.message, '[hoje-harmonia-applied]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hoje-fila-harmonia
          fetch-depth: 0
      - name: Prepare deps
        run: python -m pip install esprima
      - name: Apply remodelacao
        run: python ferramentas/patch_hoje_fila_harmonia.py
      - name: Validate
        shell: pwsh
        run: |
          git diff --check
          python ferramentas/validar.py
          node ferramentas/prova_fila_operacional_v2.js
          node ferramentas/prova_fila_operacional_v2_fatia3.js
          node ferramentas/prova_fila_operacional_v2_fatia4.js
          node ferramentas/prova_fila_operacional_v2_fatia5.js
          node ferramentas/prova_hoje_fila_harmonia.js
          python ferramentas/harness.py
          python ferramentas/diag_mobile.py 390
          python ferramentas/diag_mobile.py 1280
      - name: Foto Hoje
        run: python ferramentas/foto.py hoje 1280 1600
      - uses: actions/upload-artifact@v4
        with:
          name: hoje-fila-harmonia-1280
          path: docs/design/foto_hoje_1280.png
      - name: Clean foto and validate scope
        shell: pwsh
        run: |
          if (git ls-files --error-unmatch docs/design/foto_hoje_1280.png 2>$null) { git restore docs/design/foto_hoje_1280.png } else { Remove-Item docs/design/foto_hoje_1280.png -ErrorAction SilentlyContinue }
          git diff --name-only
          $names = (git diff --name-only | Sort-Object) -join ' '
          if ($names -ne 'public/app.css public/app.js') { throw "Escopo inesperado: $names" }
      - name: Commit product
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.js public/app.css
          git commit -m "style(frontend): harmoniza fila da Hoje [hoje-harmonia-applied]"
          git push origin HEAD:codex/hoje-fila-harmonia
