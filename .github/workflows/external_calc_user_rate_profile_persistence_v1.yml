name: External Calc - User Rate Profile Persistence G2

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260922230000_external_calc_user_rate_profile_persistence_v1.sql'
      - 'ferramentas/external-calc-user-rate/v1/**'
      - 'docs/calculadora/EXTERNAL_CALC_USER_RATE_PROFILE_BACKEND_IMPLEMENTATION_V1.md'
      - 'ferramentas/external-calc-proof-governance/v1/proof-governance.js'
      - '.github/workflows/external_calc_user_rate_profile_persistence_v1.yml'

permissions:
  contents: read

jobs:
  user-rate-profile-g2:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Prove UserRateProfile persistence contract
        run: |
          set -euo pipefail
          node ferramentas/external-calc-user-rate/v1/prova_user_rate_profile_persistence_v1.js | tee /tmp/user-rate-g2.log
          grep -q '^EXTERNAL_CALC_USER_RATE_PROFILE_PERSISTENCE_G2=PASS$' /tmp/user-rate-g2.log

      - name: Preserve beta role boundary
        run: |
          set -euo pipefail
          node ferramentas/external-calc-access/v0/prova_beta_store_team_access_v0.js | tee /tmp/beta-access.log
          grep -q '^EXTERNAL_CALC_BETA_STORE_TEAM_ACCESS_V0=PASS$' /tmp/beta-access.log

      - name: Enforce G2 boundary
        run: |
          set -euo pipefail
          FILE=supabase/migrations/20260922230000_external_calc_user_rate_profile_persistence_v1.sql

          grep -Fq "user_id = auth.uid()" "$FILE"
          grep -Fq "where status = 'ACTIVE'" "$FILE"
          grep -Fq "p_expected_active_version" "$FILE"
          grep -Fq "EXTCALC_RATE_PROFILE_CONFLICT" "$FILE"

          if grep -Fqi "service_role" "$FILE"; then
            echo "BLOQUEIO: service_role entrou no UserRateProfile G2"
            exit 1
          fi

          if grep -Fq "p_user_id" "$FILE"; then
            echo "BLOQUEIO: browser/client pode escolher user_id"
            exit 1
          fi

          echo "EXTERNAL_CALC_USER_RATE_PROFILE_G2_BOUNDARY=PASS"

      - name: Diff check
        run: git diff --check

      - name: Enforce governed scope
        run: node ferramentas/external-calc-proof-governance/v1/proof-governance.js
