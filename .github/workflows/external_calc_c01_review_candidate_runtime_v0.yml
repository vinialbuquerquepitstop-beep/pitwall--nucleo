name: External Calc C01 Review Candidate Runtime V0

on:
  push:
    branches:
      - external-calc-c01-review-candidate-runtime-impl-v0
    paths:
      - "ferramentas/external-calc-c01-review-candidate-runtime/**"
      - "ferramentas/external-calc-c01/**"
      - "ferramentas/interpreter-core/**"
      - ".github/workflows/external_calc_c01_review_candidate_runtime_v0.yml"
  pull_request:
    paths:
      - "ferramentas/external-calc-c01-review-candidate-runtime/**"
      - "ferramentas/external-calc-c01/**"
      - "ferramentas/interpreter-core/**"
      - ".github/workflows/external_calc_c01_review_candidate_runtime_v0.yml"

permissions:
  contents: read

jobs:
  candidate-runtime-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Existing C01 readonly proof
        run: node ferramentas/external-calc-c01/v1/prova_c01_readonly_bridge.js
      - name: Candidate runtime proof
        run: node ferramentas/external-calc-c01-review-candidate-runtime/v0/prova_candidate_runtime_v0.js
