name: External Calc - Core Pipeline Gate

on:
  push:
    branches:
      - feat/external-calc-core-pipeline-v1
    paths:
      - 'ferramentas/external-calc-pipeline/v1/**'
      - '.github/workflows/external_calc_core_pipeline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ferramentas/external-calc-pipeline/v1/**'
      - '.github/workflows/external_calc_core_pipeline.yml'

permissions:
  contents: read

concurrency:
  group: external-calc-core-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-gate:
    name: C01-C05 integrated core gate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Preserve C01
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c01/v1/prova_c01_readonly_bridge.js | tee /tmp/c01.log
          grep -q '^C01_READONLY_FIXTURES=PASS$' /tmp/c01.log

      - name: Preserve C02
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c02/v1/prova_c02_calculator.js | tee /tmp/c02.log
          grep -q '^C02_FIXTURES=PASS checks=17$' /tmp/c02.log

      - name: Preserve C03
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c03/v1/prova_c03_research.js | tee /tmp/c03.log
          grep -q '^C03_FIXTURES=PASS checks=21$' /tmp/c03.log

      - name: Preserve C04
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c04/v1/prova_c04_price_indicator.js | tee /tmp/c04.log
          grep -q '^C04_FIXTURES=PASS checks=20$' /tmp/c04.log

      - name: Preserve C05
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c05/v1/prova_c05_decision_output.js | tee /tmp/c05.log
          grep -q '^C05_FIXTURES=PASS checks=26$' /tmp/c05.log

      - name: Run integrated pipeline
        run: |
          set -euo pipefail
          node ferramentas/external-calc-pipeline/v1/prova_core_pipeline.js | tee /tmp/pipeline.log
          grep -q '^CORE_PIPELINE_FIXTURES=PASS checks=12$' /tmp/pipeline.log

      - name: Enforce core service boundary
        run: |
          set -euo pipefail
          FILE=ferramentas/external-calc-pipeline/v1/core-pipeline.js
          for token in 'supabase' 'postgres' 'tenant_id' 'fetch(' 'http://' 'https://' 'XMLHttpRequest' 'writeFile' 'unlink(' 'child_process' 'document.' 'window.' 'localStorage'; do
            if grep -Fqi "$token" "$FILE"; then
              echo "BLOQUEIO: dependencia proibida no core pipeline: $token"
              exit 1
            fi
          done
          echo "CORE_PIPELINE_BOUNDARY=PASS"
