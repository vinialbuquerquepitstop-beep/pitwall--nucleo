name: Calculadora — Interpreter Shadow Proof

on:
  workflow_dispatch:
  push:
    branches:
      - feat/calculadora-interpretador-real-shadow-v0
    paths:
      - 'ferramentas/interpreter-core/v1/**'
      - '.github/workflows/calculadora_interpreter_shadow.yml'

permissions:
  contents: read

concurrency:
  group: calculadora-interpreter-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-shadow-proof:
    name: Real Shadow Semantic V0
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime
        run: node --version

      - name: Run semantic real-shadow proof
        run: node ferramentas/interpreter-core/v1/prova_real_shadow_semantic.js
