name: External Calc - AI Advisor A2 Gate

on:
  push:
    branches:
      - external-calc-ai-advisor-a2-execution-v0
    paths:
      - 'ferramentas/external-calc-ai-advisor/v0/**'
      - 'ferramentas/external-calc-c01/v1/**'
      - 'ferramentas/external-calc-c02/v1/**'
      - 'ferramentas/external-calc-c03/v1/**'
      - 'ferramentas/external-calc-c04/v1/**'
      - 'ferramentas/external-calc-c05/v1/**'
      - '.github/workflows/external_calc_ai_advisor_a2.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ferramentas/external-calc-ai-advisor/v0/**'
      - '.github/workflows/external_calc_ai_advisor_a2.yml'

permissions:
  contents: read

concurrency:
  group: external-calc-ai-advisor-a2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisor-a2-gate:
    name: AI Advisor A2 execution envelope gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Preserve C01-C05 authority
        run: |
          set -euo pipefail
          node ferramentas/external-calc-c01/v1/prova_c01_readonly_bridge.js | tee /tmp/c01.log
          grep -q '^C01_READONLY_FIXTURES=PASS$' /tmp/c01.log

          node ferramentas/external-calc-c02/v1/prova_c02_calculator.js | tee /tmp/c02.log
          grep -q '^C02_FIXTURES=PASS checks=17$' /tmp/c02.log

          node ferramentas/external-calc-c03/v1/prova_c03_research.js | tee /tmp/c03.log
          grep -q '^C03_FIXTURES=PASS checks=21$' /tmp/c03.log

          node ferramentas/external-calc-c04/v1/prova_c04_price_indicator.js | tee /tmp/c04.log
          grep -q '^C04_FIXTURES=PASS checks=20$' /tmp/c04.log

          node ferramentas/external-calc-c05/v1/prova_c05_decision_output.js | tee /tmp/c05.log
          grep -q '^C05_FIXTURES=PASS checks=26$' /tmp/c05.log

      - name: Preserve Advisor A1
        run: |
          set -euo pipefail
          node ferramentas/external-calc-ai-advisor/v0/prova_advisor_context_v0.js | tee /tmp/advisor-a1.log
          grep -q '^AI_ADVISOR_A1_FIXTURES=PASS checks=15$' /tmp/advisor-a1.log

      - name: Run Advisor A2 fixtures
        run: |
          set -euo pipefail
          node ferramentas/external-calc-ai-advisor/v0/prova_advisor_executor_v0.js | tee /tmp/advisor-a2.log
          grep -q '^AI_ADVISOR_A2_FIXTURES=PASS checks=15$' /tmp/advisor-a2.log

      - name: Enforce provider-neutral read-only boundary
        run: |
          set -euo pipefail
          FILE=ferramentas/external-calc-ai-advisor/v0/advisor-executor.js
          for token in \
            'supabase' \
            'postgres' \
            'fetch(' \
            'XMLHttpRequest' \
            'writeFile' \
            'unlink(' \
            'document.' \
            'window.' \
            'localStorage' \
            "require('../../external-calc-c01" \
            "require('../../external-calc-c02" \
            "require('../../external-calc-c03" \
            "require('../../external-calc-c04" \
            "require('../../external-calc-c05"; do
            if grep -Fqi "$token" "$FILE"; then
              echo "BLOQUEIO: dependencia proibida no Advisor A2: $token"
              exit 1
            fi
          done
          echo "AI_ADVISOR_A2_BOUNDARY=PASS"

      - name: Diff check
        run: git diff --check
