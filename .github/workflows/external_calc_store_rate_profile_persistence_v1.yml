name: External Calc - Store Rate Profile Persistence G2

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260922233000_external_calc_store_rate_profile_correction_v1.sql'
      - 'ferramentas/external-calc-store-rate/v1/**'
      - 'docs/calculadora/EXTERNAL_CALC_STORE_RATE_PROFILE_BACKEND_IMPLEMENTATION_V1.md'
      - 'ferramentas/external-calc-proof-governance/v1/proof-governance.js'
      - '.github/workflows/external_calc_store_rate_profile_persistence_v1.yml'

permissions:
  contents: read

jobs:
  store-rate-profile-g2:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Prove StoreRateProfile persistence contract
        run: |
          set -euo pipefail
          node ferramentas/external-calc-store-rate/v1/prova_store_rate_profile_persistence_v1.js | tee /tmp/store-rate-g2.log
          grep -q '^EXTERNAL_CALC_STORE_RATE_PROFILE_PERSISTENCE_G2=PASS$' /tmp/store-rate-g2.log

      - name: Preserve beta access boundary
        run: |
          set -euo pipefail
          node ferramentas/external-calc-access/v0/prova_beta_store_team_access_v0.js | tee /tmp/beta-access.log
          grep -q '^EXTERNAL_CALC_BETA_STORE_TEAM_ACCESS_V0=PASS$' /tmp/beta-access.log

      - name: Enforce corrected ownership
        run: |
          set -euo pipefail
          FILE=supabase/migrations/20260922233000_external_calc_store_rate_profile_correction_v1.sql

          grep -Fq "v_role is distinct from 'dono'" "$FILE"
          grep -Fq "where p.tenant_id = v_tenant" "$FILE"
          grep -Fq "EXTCALC_STORE_RATE_PROFILE_CONFLICT" "$FILE"

          if grep -Fq "p_user_id" "$FILE"; then
            echo "BLOQUEIO: client/user voltou a escolher ownership"
            exit 1
          fi

          echo "EXTERNAL_CALC_STORE_RATE_PROFILE_G2_BOUNDARY=PASS"

      - name: Diff check
        run: git diff --check

      - name: Enforce governed scope
        run: node ferramentas/external-calc-proof-governance/v1/proof-governance.js
