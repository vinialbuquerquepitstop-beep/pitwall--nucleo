name: External Calc — Interpreter Ready Runtime Audit

on:
  push:
    branches:
      - audit/interpreter-ready-runtime-v1
    paths:
      - 'ferramentas/interpreter-core/v1/**'
      - 'docs/calculadora/INTERPRETER_READY_GATE_V1.md'
      - '.github/workflows/interpreter_ready_runtime_audit.yml'
  workflow_dispatch:
    inputs:
      load_id:
        description: "UUID de uma calc_carga real com texto_bruto. Somente leitura."
        required: false
        default: "6c4d3491-f85b-4015-8393-9798ab1ce758"
        type: string

permissions:
  contents: read

concurrency:
  group: interpreter-ready-runtime-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-gate:
    name: Interpreter local gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run consolidated local gate
        run: |
          set -euo pipefail
          node ferramentas/interpreter-core/v1/gate_interpreter_ready_local.js | tee /tmp/interpreter-local-gate.log
          grep -q '^GATE_LOCAL=PASS' /tmp/interpreter-local-gate.log

      - name: Static trust-boundary audit
        run: |
          set -euo pipefail
          CORE=ferramentas/interpreter-core/v1/core.js
          for token in 'supabase' 'postgres' 'tenant_id' 'calc_' 'fetch(' 'http://' 'https://'; do
            if grep -Fqi "$token" "$CORE"; then
              echo "BLOQUEIO: token proibido encontrado no Core: $token"
              exit 1
            fi
          done
          echo "CORE_BOUNDARY=PASS"

  real-corpus-gate:
    name: Real corpus promotion gate
    needs: local-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOAD_ID: ${{ github.event.inputs.load_id || '6c4d3491-f85b-4015-8393-9798ab1ce758' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install PostgreSQL client 17
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/psql --version

      - name: Prepare private read-only benchmark input
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          export PATH="/usr/lib/postgresql/17/bin:$PATH"

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "FALHA: SUPABASE_DB_URL secret ausente."
            exit 1
          fi

          if ! [[ "$LOAD_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "FALHA: load_id invalido."
            exit 1
          fi

          OWNER_ID="$(
            psql "$SUPABASE_DB_URL" --no-psqlrc -X -qAt -v ON_ERROR_STOP=1 \
              -c "select u.id::text
                    from public.app_usuario u
                    join public.calc_carga c on c.tenant_id = u.tenant_id
                   where c.id = '$LOAD_ID'::uuid
                     and u.ativo
                     and u.papel = 'dono'
                   order by u.id
                   limit 1"
          )"

          if [ -z "$OWNER_ID" ]; then
            echo "FALHA: dono ativo nao encontrado para o tenant da carga."
            exit 1
          fi

          CLAIMS="{\"sub\":\"$OWNER_ID\"}"

          psql "$SUPABASE_DB_URL" --no-psqlrc -X -qAt -v ON_ERROR_STOP=1 \
            -v claims="$CLAIMS" -v load_id="$LOAD_ID" <<'SQL'
          \o /dev/null
          select set_config('request.jwt.claims', :'claims', false);

          \o /tmp/calc_raw.b64
          select encode(convert_to(texto_bruto, 'UTF8'), 'base64')
            from public.calc_carga
           where id = :'load_id'::uuid
             and texto_bruto is not null;

          \o /tmp/calc_legacy.b64
          select encode(
                   convert_to(public.calc_bench_ler(texto_bruto)::text, 'UTF8'),
                   'base64'
                 )
            from public.calc_carga
           where id = :'load_id'::uuid
             and texto_bruto is not null;
          \o
          SQL

          test -s /tmp/calc_raw.b64
          test -s /tmp/calc_legacy.b64

          base64 --decode /tmp/calc_raw.b64 > /tmp/calc_raw.txt
          base64 --decode /tmp/calc_legacy.b64 > /tmp/calc_legacy.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/calc_legacy.json','utf8'));"
          echo "PRIVATE_INPUT_READY=1"

      - name: Enforce real-corpus promotion gate
        run: |
          set -euo pipefail
          node ferramentas/interpreter-core/v1/benchmark_real_load.js \
            /tmp/calc_raw.txt /tmp/calc_legacy.json | tee /tmp/interpreter-real-benchmark.log

          grep -q '^BENCHMARK_CONCLUIDO=1$' /tmp/interpreter-real-benchmark.log
          grep -q '^PROMOTION_READY=true$' /tmp/interpreter-real-benchmark.log
          echo "REAL_CORPUS_GATE=PASS"

      - name: Cleanup private benchmark files
        if: always()
        run: |
          rm -f /tmp/calc_raw.b64 /tmp/calc_legacy.b64 \
                /tmp/calc_raw.txt /tmp/calc_legacy.json \
                /tmp/interpreter-real-benchmark.log
