name: External Calc - Contract Chain Gate V1

on:
  push:
    branches:
      - audit/external-calc-contract-chain-v2
    paths:
      - 'ferramentas/external-calc-chain/v1/**'
      - '.github/workflows/external_calc_contract_chain_v1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ferramentas/external-calc-chain/v1/**'
      - '.github/workflows/external_calc_contract_chain_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-calc-contract-chain-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chain-gate:
    name: C01-C05 integrated contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Preserve all contract gates
        run: |
          set -euo pipefail

          node ferramentas/external-calc-c01/v1/prova_c01_readonly_bridge.js | tee /tmp/c01.log
          grep -q '^C01_READONLY_FIXTURES=PASS$' /tmp/c01.log

          node ferramentas/external-calc-c02/v1/prova_c02_calculator.js | tee /tmp/c02.log
          grep -q '^C02_FIXTURES=PASS checks=17$' /tmp/c02.log

          node ferramentas/external-calc-c03/v1/prova_c03_research.js | tee /tmp/c03.log
          grep -q '^C03_FIXTURES=PASS checks=21$' /tmp/c03.log

          node ferramentas/external-calc-c04/v1/prova_c04_price_indicator.js | tee /tmp/c04.log
          grep -q '^C04_FIXTURES=PASS checks=20$' /tmp/c04.log

          node ferramentas/external-calc-c05/v1/prova_c05_decision_output.js | tee /tmp/c05.log
          grep -q '^C05_FIXTURES=PASS checks=26$' /tmp/c05.log

      - name: Run integrated raw-to-decision chain
        run: |
          set -euo pipefail
          node ferramentas/external-calc-chain/v1/prova_contract_chain.js | tee /tmp/chain.log
          grep -q '^EXTERNAL_CALC_CHAIN=PASS checks=8$' /tmp/chain.log
          grep -q '^CHAIN_SELECTIVE_STALENESS=PASS$' /tmp/chain.log

      - name: Enforce no platform coupling in chain proof
        run: |
          set -euo pipefail
          FILE=ferramentas/external-calc-chain/v1/prova_contract_chain.js
          for token in 'supabase' 'postgres' 'tenant_id' 'fetch(' 'http://' 'https://' 'writeFile' 'child_process'; do
            if grep -Fqi "$token" "$FILE"; then
              echo "BLOQUEIO: dependencia de Platform no chain proof: $token"
              exit 1
            fi
          done
          echo "CHAIN_BOUNDARY=PASS"
