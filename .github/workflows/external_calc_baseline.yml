name: External Calc — Baseline Proof

on:
  pull_request:
    branches:
      - audit/external-calc-baseline-r2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-calc-baseline-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  interpreter-baseline:
    name: Interpreter baseline — local only
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Runtime
        run: node --version

      - name: Interpreter Ready local gate
        run: node ferramentas/interpreter-core/v1/gate_interpreter_ready_local.js
